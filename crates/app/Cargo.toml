[package]
name = "markdown-viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
markdown-core = { path = "../markdown-core" }
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-rust", "tree-sitter-yaml", "tree-sitter-markdown"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ignore = "0.4"
notify = "8"

[features]
screenshot = ["gpui-kit/test-support"]

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
tempfile = "3"
